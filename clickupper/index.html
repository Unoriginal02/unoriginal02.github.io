<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ClickUpper</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <nav id="barra">
        <span class="marca">ClickUpper</span>
        <div class="selector">
            <button data-pestana="tablero">Tablero</button>
            <button data-pestana="horas">Horas</button>
        </div>
        <span class="hueco"></span>
        <span id="usuario" class="dim"></span>
        <button id="sincronizar" class="btn" title="Volver a leer tareas de ClickUp">⟳ Sincronizar</button>
        <button id="copia" class="btn" title="Chrome necesita un clic para seguir guardando la copia" hidden>Reactivar copia</button>
        <button id="ajustes" class="btn">Ajustes</button>
    </nav>

    <main id="vista-tablero" hidden>
        <div id="tablero-zona">
            <div id="columnas"></div>
        </div>
        <aside id="favoritas" hidden></aside>
        <aside id="registro"></aside>
    </main>

    <main id="vista-horas" hidden>
        <div id="horas-barra"></div>
        <div id="horas-cuerpo"></div>
    </main>

    <footer id="pie"><span id="estado"></span></footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
